run-name: Build ${{ inputs.system }} wazuh-server on ${{ inputs.architecture }} ${{ inputs.is_stage && '- is stage' || '' }} ${{ inputs.checksum && '- checksum' || '' }} ${{ inputs.debug && '- debug' || '' }} ${{ inputs.id }}
name: Build Wazuh server

on:
  workflow_dispatch:
    inputs:
      docker_image_tag:
        description: |
          Tag name of the Docker image to be downloaded.
          Use 'developer' to set branch name as tag.
          Use 'auto' to set branch version as tag.
          If using a custom tag, use only '-', '_', '.' and alphanumeric characters.
          Default is 'auto'.
        default: 'auto'
        type: string
        required: false
      architecture:
        description: |
          Architecture of the package [amd64, x86_64]
        type: choice
        options:
          - amd64
          - x86_64
        required: true
      system:
        description: 'Package format [deb, rpm]'
        type: choice
        options:
          - deb
          - rpm
        required: true
      revision:
        description: |
          Set the value to "1" for packages in release format.
          You can also add other values, such as issue numbers.
          By default, it is set to "0" for development.
        default: "0"
        type: string
        required: false
      is_stage:
        description: |
          Build package with release format.
          By default: false
        type: boolean
        required: false
      debug:
        description: |
          Build the binaries with debug symbols.
          By default: false
        type: boolean
        required: false
      checksum:
        description: Generate package checksum.
        type: boolean
        required: false
      id:
        type: string
        description: |
          ID used to identify the workflow uniquely.
        required: false

  workflow_call:
    inputs:
      docker_image_tag:
        required: false
        default: 'auto'
        type: string
      architecture:
        type: string
        required: true
      system:
        type: string
        required: true
      revision:
        default: "0"
        type: string
        required: false
      is_stage:
        type: boolean
        required: false
      debug:
        type: boolean
        required: false
      checksum:
        type: boolean
        required: false
      id:
        type: string
        required: false

env:
  LOCAL_PRECOMPILED_STORE_PATH: src/engine/engine_precompiled_store.tar.gz

jobs:
  Build-server-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    name: Build ${{ inputs.system }} wazuh-server on ${{ inputs.architecture }}

    steps:
      - name: Cancel previous runs
        uses: fkirc/skip-duplicate-actions@master
        with:
          cancel_others: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_after_successful_duplicate: 'false'

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set tag and container name
        run: |
          VERSION=$(sed 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)/\1/' $GITHUB_WORKSPACE/src/VERSION)
          if [ "${{ inputs.docker_image_tag }}" == "auto" ]; then echo "TAG=$VERSION" >> $GITHUB_ENV;
          elif [ "${{ inputs.docker_image_tag }}" == "developer" ]; then echo "TAG=$(sed 's|[/\]|--|g' <<< ${{ github.ref_name }})" >> $GITHUB_ENV;
          else echo "TAG=${{ inputs.docker_image_tag }}" >> $GITHUB_ENV; fi
          echo "CONTAINER_NAME=pkg_${{ inputs.system }}_server_builder_amd64" >> $GITHUB_ENV

      - name: Download docker image for package building
        run: |
          mkdir -p $GITHUB_WORKSPACE/.github/actions/use-local-image
          cat > $GITHUB_WORKSPACE/.github/actions/use-local-image/use_local_image.sh << 'EOF'
          #!/bin/bash
          # Script to pull Docker image from GitHub Container Registry
          
          GITHUB_TOKEN=$1
          GITHUB_USER=$2
          CONTAINER_NAME=$3
          DOCKER_IMAGE_TAG=$4
          GITHUB_OWNER="nikinov"
          
          echo "Logging in to GitHub Container Registry"
          echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_USER --password-stdin
          
          echo "Pulling Docker image from GitHub Container Registry: ghcr.io/${GITHUB_OWNER}/${CONTAINER_NAME}:${DOCKER_IMAGE_TAG}"
          docker pull ghcr.io/${GITHUB_OWNER}/${CONTAINER_NAME}:${DOCKER_IMAGE_TAG}
          
          if [ $? -ne 0 ]; then
            echo "Error: Failed to pull Docker image ghcr.io/${GITHUB_OWNER}/${CONTAINER_NAME}:${DOCKER_IMAGE_TAG}"
            exit 1
          fi
          
          # Tag the image with the expected name
          echo "Tagging image as ${CONTAINER_NAME}:${DOCKER_IMAGE_TAG}"
          docker image tag ghcr.io/${GITHUB_OWNER}/${CONTAINER_NAME}:${DOCKER_IMAGE_TAG} ${CONTAINER_NAME}:${DOCKER_IMAGE_TAG}
          EOF
          chmod +x $GITHUB_WORKSPACE/.github/actions/use-local-image/use_local_image.sh
          bash $GITHUB_WORKSPACE/.github/actions/use-local-image/use_local_image.sh ${{ secrets.GITHUB_TOKEN }} ${{ github.actor}} $CONTAINER_NAME ${{ env.TAG }}

      - name: Build ${{ inputs.system }} wazuh-server on ${{ inputs.architecture }}
        working-directory: packages
        run: |
          # Create debian template files needed for packaging
          mkdir -p $GITHUB_WORKSPACE/packages/debian_templates
          
          cat > $GITHUB_WORKSPACE/packages/debian_templates/changelog << 'EOF'
          guardbear-server (5.0.0-RELEASE) stable; urgency=low
          
            * More info: https://documentation.guardbear.io/current/release-notes/
          
           -- GuardBear, Inc <info@guardbear.io>  $(date -R)
          EOF
          
          cat > $GITHUB_WORKSPACE/packages/debian_templates/control << 'EOF'
          Source: guardbear-server
          Section: admin
          Priority: optional
          Maintainer: GuardBear, Inc <info@guardbear.io>
          Build-Depends: debhelper (>= 9), make, gcc, libc6-dev
          Standards-Version: 4.0.0
          Homepage: https://www.guardbear.io
          
          Package: guardbear-server
          Architecture: any
          Depends: ${shlibs:Depends}, ${misc:Depends}
          Description: GuardBear SIEM server
           GuardBear Server - Security Information and Event Management
          EOF
          
          cat > $GITHUB_WORKSPACE/packages/debian_templates/rules << 'EOF'
          #!/usr/bin/make -f
          
          export JOBS=4
          export DEBUG_ENABLED=no
          export PATH=/usr/local/gcc-5.5.0/bin:$PATH
          export LD_LIBRARY_PATH=
          export INSTALLATION_DIR=/
          
          %:
          	dh $@
          
          override_dh_auto_build:
          	dh_auto_build
          	echo "Building GuardBear Server"
          
          override_dh_strip:
          	dh_strip --no-automatic-dbgsym
          EOF
          
          cat > $GITHUB_WORKSPACE/packages/debian_templates/script_template << 'EOF'
          #!/bin/sh
          DIR="/"
          exit 0
          EOF
          
          REVISION=${{ inputs.revision }}
          FLAGS="-s /tmp --dont-build-docker -j $(nproc) "
          if [ -z "$REVISION" ]; then FLAGS+="-r 0 "; else FLAGS+="-r $REVISION "; fi
          if [ "${{ inputs.is_stage }}" == "true" ]; then FLAGS+="--is_stage "; fi
          if [ "${{ inputs.checksum }}" == "true" ]; then FLAGS+="--checksum "; fi
          if [ "${{ inputs.debug}}" == "true" ]; then FLAGS+="--debug "; fi
          # Every call to this workflow will be internally managed as amd64, which is synonymous with x86_64
          FLAGS+="--sources $GITHUB_WORKSPACE "
          echo "generate_package.sh -a amd64 --tag ${{ env.TAG }} --system ${{ inputs.system }} $FLAGS"
          
          # Variables for the Docker container
          CONTAINER_NAME=pkg_${{ inputs.system }}_server_builder_amd64
          DOCKERFILE_PATH=$GITHUB_WORKSPACE/packages/${{ inputs.system }}s/amd64
          
          # Fix line endings (convert CRLF to LF)
          find $GITHUB_WORKSPACE/packages -type f -name "*.sh" -exec sed -i 's/\r$//' {} \;
          
          # Create a fix script to run inside container
          cat > $GITHUB_WORKSPACE/packages/fix_and_build.sh << 'EOL'
          #!/bin/bash
          set -e
          # Fix line endings in helper scripts inside container
          if [ -f "/usr/local/bin/helper_function.sh" ]; then
            sed -i 's/\r$//' /usr/local/bin/helper_function.sh
          fi
          if [ -f "/tmp/gen_permissions.sh" ]; then
            sed -i 's/\r$//' /tmp/gen_permissions.sh
          fi
          
          # Create symlinks to handle path mismatches
          if [ -d "/guardbear-local-src" ] && [ ! -d "/wazuh-local-src" ]; then
            ln -s /guardbear-local-src /wazuh-local-src
          elif [ -d "/wazuh-local-src" ] && [ ! -d "/guardbear-local-src" ]; then
            ln -s /wazuh-local-src /guardbear-local-src
          fi
          
          # Configure Git to allow these directories (fixes dubious ownership error)
          git config --global --add safe.directory /wazuh-local-src
          git config --global --add safe.directory /guardbear-local-src
          
          # Create necessary directory structure for the build
          mkdir -p /wazuh-local-src/packages/debs/SPECS/debian
          mkdir -p /wazuh-local-src/packages/rpms/SPECS
          
          # Copy template files
          cp /wazuh-local-src/packages/debian_templates/changelog /wazuh-local-src/packages/debs/SPECS/debian/
          cp /wazuh-local-src/packages/debian_templates/control /wazuh-local-src/packages/debs/SPECS/debian/
          cp /wazuh-local-src/packages/debian_templates/rules /wazuh-local-src/packages/debs/SPECS/debian/
          
          # Create script files
          for script in preinst postinst prerm postrm; do
            cp /wazuh-local-src/packages/debian_templates/script_template /wazuh-local-src/packages/debs/SPECS/debian/$script
            chmod +x /wazuh-local-src/packages/debs/SPECS/debian/$script
          done
          
          chmod +x /wazuh-local-src/packages/debs/SPECS/debian/rules
          
          # Run the build script with all arguments passed to this script
          /wazuh-local-src/packages/build.sh "$@"
          EOL
          
          chmod +x $GITHUB_WORKSPACE/packages/fix_and_build.sh
          
          # Run the container with the fix-and-build script
          docker run -t --rm \
            -v /tmp:/var/local/guardbear:Z \
            -e SYSTEM=${{ inputs.system }} \
            -e ARCHITECTURE_TARGET=amd64 \
            -e INSTALLATION_PATH=/ \
            -e IS_STAGE=${{ inputs.is_stage || 'no' }} \
            -e GUARDBEAR_BRANCH=buildbranch3 \
            -v $GITHUB_WORKSPACE:/wazuh-local-src:Z \
            --entrypoint /bin/bash \
            $CONTAINER_NAME:${{ env.TAG }} \
            -c "/wazuh-local-src/packages/fix_and_build.sh 0 $(nproc) ${{ inputs.debug && 'yes' || 'no' }} ${{ inputs.checksum && 'yes' || 'no' }} no no"
          
          # Find the built packages
          if [ "${{ inputs.system }}" == "deb" ]; then
            SYMBOLS_TAG="dbg"
          else
            SYMBOLS_TAG="debuginfo"
          fi
          # Find all files starting with 'guardbear-server' and ending with '.rpm or .deb'
          for file in $(find /tmp -maxdepth 1 -type f -name 'guardbear-server*.${{ inputs.system }}' -exec basename {} 2>/dev/null \;); do
            if [[ "$file" == *"$SYMBOLS_TAG"* ]]; then
              PACKAGE_SYMBOLS_NAME="$file"
            else
              PACKAGE_NAME="$file"
            fi
          done
          
          echo "PACKAGE_NAME=${PACKAGE_NAME}" | tee -a $GITHUB_ENV
          echo "PACKAGE_SYMBOLS_NAME=${PACKAGE_SYMBOLS_NAME}" | tee -a $GITHUB_ENV

      - name: Test install built server
        run: |
          if [ -z "${{ env.PACKAGE_NAME }}" ]; then echo "No package found matching the pattern!"; exit 1; fi
          sudo docker run -v $GITHUB_WORKSPACE/.github/actions/test-install-components/:/tests -v /tmp/:/packages --entrypoint '/tests/install_component.sh' $CONTAINER_NAME:${{ env.TAG }} $PACKAGE_NAME server
          # Check if GuardBear was installed. The /tmp/status.log file was generated in the previous step.
          if grep -iq " installed.*guardbear-server" /tmp/status.log ; then
            echo "Installation successfully."
          else
            echo "The installation could not be completed. The package will not be uploaded.";
            exit 1;
          fi
      
      - name: Upload package to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: /tmp/${{ env.PACKAGE_NAME }}
          if-no-files-found: error
      
      - name: Upload debug symbols to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_SYMBOLS_NAME }}
          path: /tmp/${{ env.PACKAGE_SYMBOLS_NAME }}
          if-no-files-found: error
