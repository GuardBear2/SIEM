services:
  guardbear-master:
    build:
      context: .
      dockerfile: base/manager/manager.Dockerfile
    image: integration_test_guardbear-manager
    hostname: guardbear-master
    ports:
      - "55000:55000"
    volumes:
      - ./configurations/tmp/manager:/tmp_volume
      - ./tools/:/tools
    entrypoint:
      - /scripts/entrypoint.sh
      - guardbear-master
      - master-node
      - master
      - ${ENV_MODE}

  guardbear-worker1:
    profiles:
      - cluster
    image: integration_test_guardbear-manager
    hostname: guardbear-worker1
    volumes:
      - ./configurations/tmp/manager:/tmp_volume
      - ./tools/:/tools
    entrypoint:
      - /scripts/entrypoint.sh
      - guardbear-master
      - worker1
      - worker
    depends_on:
      - guardbear-master

  guardbear-worker2:
    image: integration_test_guardbear-manager
    hostname: guardbear-worker2
    volumes:
      - ./configurations/tmp/manager:/tmp_volume
      - ./tools/:/tools
    entrypoint:
      - /scripts/entrypoint.sh
      - guardbear-master
      - worker2
      - worker
    depends_on:
      - guardbear-master

  guardbear-agent1:
    build:
      context: .
      dockerfile: base/agent/new.Dockerfile
    image: integration_test_guardbear-agent
    hostname: guardbear-agent1
    volumes:
      - ./configurations/tmp/agent:/tmp_volume
      - ./tools/:/tools
    entrypoint:
      - /scripts/entrypoint.sh
      - haproxy-lb
      - guardbear-agent1
    depends_on:
      - haproxy-lb

  guardbear-agent2:
    image: integration_test_guardbear-agent
    hostname: guardbear-agent2
    volumes:
      - ./configurations/tmp/agent:/tmp_volume
      - ./tools/:/tools
    entrypoint:
      - /scripts/entrypoint.sh
      - haproxy-lb
      - guardbear-agent2
    depends_on:
      - guardbear-agent1
      - haproxy-lb

  guardbear-agent3:
    image: integration_test_guardbear-agent
    hostname: guardbear-agent3
    volumes:
      - ./configurations/tmp/agent:/tmp_volume
      - ./tools/:/tools
    entrypoint:
      - /scripts/entrypoint.sh
      - haproxy-lb
      - guardbear-agent3
    depends_on:
      - guardbear-agent2
      - haproxy-lb

  guardbear-agent4:
    image: integration_test_guardbear-agent
    hostname: guardbear-agent4
    volumes:
      - ./configurations/tmp/agent:/tmp_volume
      - ./tools/:/tools
    entrypoint:
      - /scripts/entrypoint.sh
      - haproxy-lb
      - guardbear-agent4
    depends_on:
      - guardbear-agent3
      - haproxy-lb

  guardbear-agent5:
    build:
      context: .
      dockerfile: base/agent/old.Dockerfile
    image: integration_test_guardbear-agent_old
    hostname: guardbear-agent5
    volumes:
      - ./configurations/tmp/agent:/tmp_volume
      - ./tools/:/tools
    entrypoint:
      - /scripts/entrypoint.sh
      - haproxy-lb
      - guardbear-agent5
      - agent_old
    depends_on:
      - guardbear-agent4
      - haproxy-lb

  guardbear-agent6:
    image: integration_test_guardbear-agent_old
    hostname: guardbear-agent6
    volumes:
      - ./configurations/tmp/agent:/tmp_volume
      - ./tools/:/tools
    entrypoint:
      - /scripts/entrypoint.sh
      - haproxy-lb
      - guardbear-agent6
      - agent_old
    depends_on:
      - guardbear-agent5
      - haproxy-lb

  guardbear-agent7:
    image: integration_test_guardbear-agent_old
    hostname: guardbear-agent7
    volumes:
      - ./configurations/tmp/agent:/tmp_volume
      - ./tools/:/tools
    entrypoint:
      - /scripts/entrypoint.sh
      - haproxy-lb
      - guardbear-agent7
      - agent_old
    depends_on:
      - guardbear-agent6
      - haproxy-lb

  guardbear-agent8:
    image: integration_test_guardbear-agent_old
    hostname: guardbear-agent8
    volumes:
      - ./configurations/tmp/agent:/tmp_volume
      - ./tools/:/tools
    entrypoint:
      - /scripts/entrypoint.sh
      - haproxy-lb
      - guardbear-agent8
      - agent_old
    depends_on:
      - guardbear-agent7
      - haproxy-lb

  haproxy-lb:
    build:
      context: ./base/haproxy-lb
    image: integration_test_haproxy-lb
    entrypoint:
      - /scripts/entrypoint.sh
      - ${ENV_MODE}
    depends_on:
      - guardbear-master
      - guardbear-worker1
      - guardbear-worker2

  cti:
    build:
      context: ./base/cti
    image: integration_test_cti
    restart: always
    environment:
      - PORT=4041
